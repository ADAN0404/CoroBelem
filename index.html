<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba de maquetación · Coro Belém</title><style>
:root{font-family:Arial,sans-serif;color:#30251d}*{box-sizing:border-box}body{margin:0;background:#f5f1eb}header{background:#47050a;color:white;padding:15px 20px}h1{font-size:19px;margin:0}main{max-width:1100px;margin:20px auto;padding:0 14px}.panel{background:white;border:1px solid #d8c4a2;border-radius:12px;padding:17px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.choice{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid #eee0c9;border-radius:8px}button{background:#47050a;color:white;border:0;border-radius:7px;padding:11px 15px;cursor:pointer}button:disabled{opacity:.35}button.secondary{background:white;color:#47050a;border:1px solid #a97f52}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.reader{background:#ded9d2;min-height:300px;display:flex;justify-content:center;align-items:flex-start;padding:15px 6px 70px;position:relative;overflow:auto}.paper{background:white;box-shadow:0 4px 20px #0002;flex:none;line-height:0}.paper svg{display:block;width:100%;height:100%}.nav{position:sticky;bottom:10px;display:flex;align-items:center;justify-content:center;gap:10px;background:#47050a;color:white;border-radius:30px;padding:7px;margin:12px auto;max-width:360px}.nav button{padding:7px 14px;background:transparent;font-size:23px}#status{font-size:13px;color:#6b4b2a}small{color:#685b4f}
</style></head><body><header><h1>Orquesta Belém · Prueba de partituras dinámicas</h1></header><main><section class="panel"><strong>Selecciona cualquier combinación de instrumentos</strong><p><small>La hoja A4 mantiene su proporción; el motor calcula de nuevo los sistemas y el número de páginas.</small></p><div id="choices" class="grid"></div><div class="actions"><button class="secondary" id="all">Todos</button><button class="secondary" id="none">Ninguno</button><button id="render">Generar partitura</button></div><div id="status" role="status">Cargando…</div></section><div class="reader" id="reader"><div class="paper" id="paper"></div></div><nav class="nav"><button id="prev" aria-label="Hoja anterior">‹</button><span id="count">Sin páginas</span><button id="next" aria-label="Hoja siguiente">›</button></nav></main><script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js"></script><script>
const $=id=>document.getElementById(id);let toolkit,original,parts=[],page=1,total=0,lastSVG='',generation=0;
const setStatus=s=>$('status').textContent=s;
function xmlDoc(str){const d=new DOMParser().parseFromString(str,'application/xml');if(d.querySelector('parsererror'))throw Error('MusicXML no válido');return d}
function filteredXML(ids){const d=xmlDoc(original);const keep=new Set(ids);const pl=d.getElementsByTagName('part-list')[0];for(const node of [...pl.children]){if(node.localName==='score-part'&&!keep.has(node.getAttribute('id')))node.remove();if(node.localName==='part-group')node.remove()}for(const p of [...d.documentElement.children])if(p.localName==='part'&&!keep.has(p.getAttribute('id')))p.remove();return new XMLSerializer().serializeToString(d)}
function resizePaper(){if(!lastSVG)return;const w=Math.max(220,Math.min($('reader').clientWidth-14,760));$('paper').style.width=w+'px';$('paper').style.height=(w*297/210)+'px'}
function showPage(){if(!toolkit||!total)return;lastSVG=toolkit.renderToSVG(page,{});$('paper').innerHTML=lastSVG;resizePaper();$('count').textContent=`Hoja ${page} de ${total}`;$('prev').disabled=page<=1;$('next').disabled=page>=total}
function generate(){const ids=[...document.querySelectorAll('#choices input:checked')].map(e=>e.value);if(!ids.length){setStatus('Selecciona al menos un instrumento.');return}if(!toolkit){setStatus('Esperando motor de partituras…');return}try{setStatus('Maquetando '+ids.length+' instrumentos…');toolkit.setOptions({pageWidth:2100,pageHeight:2970,scale:40,breaks:'auto',adjustPageHeight:false,footer:'none',header:'none'});const ok=toolkit.loadData(filteredXML(ids));if(ok===false)throw Error('Verovio no pudo leer la selección');total=toolkit.getPageCount();if(!total)throw Error('No se generaron páginas');page=1;showPage();setStatus(`${ids.length} instrumentos · ${total} hoja(s) calculadas por Verovio`)}catch(e){console.error(e);setStatus('Error: '+e.message)}}
$('all').onclick=()=>document.querySelectorAll('#choices input').forEach(e=>e.checked=true);$('none').onclick=()=>document.querySelectorAll('#choices input').forEach(e=>e.checked=false);$('render').onclick=generate;$('prev').onclick=()=>{if(page>1){page--;showPage()}};$('next').onclick=()=>{if(page<total){page++;showPage()}};let tx=0,ty=0;$('reader').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});$('reader').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4){if(dx<0)$('next').click();else $('prev').click()}},{passive:true});window.addEventListener('resize',resizePaper);
async function start(){try{const res=await fetch('Orquestaciones/portones.musicxml');if(!res.ok)throw Error('No se encontró el MusicXML (usa GitHub Pages, no file://)');original=await res.text();const d=xmlDoc(original);parts=[...d.getElementsByTagName('score-part')].map(p=>({id:p.getAttribute('id'),name:p.getElementsByTagName('part-name')[0]?.textContent||p.getAttribute('id')}));$('choices').replaceChildren(...parts.map(p=>{const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type='checkbox';input.value=p.id;input.checked=true;label.append(input,document.createTextNode(p.name));return label}));if(!window.verovio?.module)throw Error('No cargó la biblioteca Verovio');await new Promise((resolve,reject)=>{const m=verovio.module;if(m.calledRun||m.runtimeInitialized){resolve();return}const prev=m.onRuntimeInitialized;m.onRuntimeInitialized=()=>{if(typeof prev==='function')prev();resolve()};setTimeout(()=>reject(Error('Verovio tardó demasiado en iniciar')),15000)});toolkit=new verovio.toolkit();generate()}catch(e){console.error(e);setStatus('Error: '+e.message)}}start();
</script></body></html>
