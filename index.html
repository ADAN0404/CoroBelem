:root{--gold:#dfb86c;--wine:#ffffff;--cream:#27211c}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#ffffff 0%,#faf8f4 100%);
color:var(--cream);font-family:Inter,Arial,sans-serif;min-height:100vh}
.hero{position:relative;background:#47050a}
.hero img{display:block;width:100%;height:auto;max-height:530px;object-fit:contain}
.hero:after{content:'';position:absolute;bottom:0;left:0;right:0;height:28px;background:linear-gradient(transparent,#ffffff)}
.intro{text-align:center;padding:20px 16px 8px}
.eyebrow{font-size:11px;letter-spacing:.38em;color:var(--gold);text-transform:uppercase}
.intro h1{font:600 clamp(27px,5vw,45px) Cinzel,Georgia,serif;margin:12px 0;color:#785425}
.intro p{color:#665c54;font-size:14px}
.ornament{color:var(--gold);margin:12px auto 0;letter-spacing:12px}
.layout{max-width:1160px;margin:20px auto 80px;padding:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.panel{background:#ffffff;border:1px solid rgba(173,137,78,.38);border-radius:16px;padding:26px;box-shadow:0 12px 35px #3d302014}
.panel h2{font:500 23px Cinzel,Georgia,serif;color:#755020;margin:0 0 18px}
.panel .sub{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#977038;margin-bottom:12px}.full{grid-column:1/-1}
.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.canto-item{border:1px solid #8e67455c;background:#fffdf9;color:#302922;border-radius:9px;padding:14px 15px;cursor:pointer;text-align:left;font:500 14px Inter,Arial,sans-serif;transition:.2s;overflow-wrap:anywhere}
.canto-item:hover,.canto-item:focus-visible{background:#f7edd9;border-color:#e4bb72;outline:none}
.category-grid .canto-item:before{content:'✧';color:var(--gold);margin-right:10px}
.song-list{display:grid;gap:9px;max-height:460px;overflow:auto}.song-list .canto-item{display:flex;justify-content:space-between;align-items:center;gap:10px}.song-list .canto-item:after{content:'＋';font-size:21px;color:var(--gold)}select{width:100%;padding:15px 18px;background:#fffdf9;border:1px solid #bd945d;color:#302922;border-radius:9px;font:500 15px Inter,Arial,sans-serif}
.selected-cantos .selected-row{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #c49b534a;padding:14px 0;font-size:14px}.selected-row .num{color:var(--gold);margin-right:13px}
.remove-btn{background:none;border:1px solid #c5a77c;border-radius:7px;color:#76532f;padding:7px 11px;cursor:pointer;flex-shrink:0}
.remove-btn:hover{background:#f5e8dc}.empty{color:#766e66;font-size:14px;line-height:1.7}.primary{background:linear-gradient(120deg,#eac989,#bc8845);color:#310d0d;border:0;border-radius:9px;padding:16px 25px;font:700 14px Inter,Arial,sans-serif;cursor:pointer;width:100%;letter-spacing:.03em}.primary:hover{filter:brightness(1.12)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px}.counter{color:var(--gold);font-size:13px}.overlay{position:fixed;inset:0;z-index:2000;background:#fff;display:none;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}.overlay img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;transition:transform .15s ease}
.viewer-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;background:transparent;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.85),0 0 9px rgba(0,0,0,.55);padding:10px 16px;z-index:3;font-size:13px;transition:opacity .55s ease,visibility .55s ease}
.viewer-top button{border:0;background:transparent;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.85);border-radius:7px;padding:9px 13px;cursor:pointer}.viewer-top.oculto{opacity:0;visibility:hidden;pointer-events:none}

.footer{text-align:center;color:#8c765c;font-size:12px;padding:0 15px 32px}
.hidden{display:none!important}@media(max-width:720px){.layout{grid-template-columns:1fr;padding:0 13px;gap:14px;margin-top:10px}
.panel{padding:20px}.hero img{min-height:160px;object-fit:cover;object-position:center}.intro{padding-top:12px}
.category-grid{grid-template-columns:1fr 1fr}.panel h2{font-size:20px}}</style>
